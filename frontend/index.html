<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ParkEase - Online Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand parking-brand" href="#">ParkEase</a>
            <div>
                <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5 pt-5 text-center layout-animate" style="min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 class="display-3 fw-bold mb-3" style="color: var(--text-main); letter-spacing: -1.5px;">Find Parking In <span class="text-primary">Seconds</span></h1>
        <p class="lead text-muted mt-3 mb-5 fs-4 mx-auto" style="max-width: 600px;">Secure your parking spot in advance with ParkEase. Skip the endless driving and enjoy a seamless, contactless booking experience.</p>
        <div class="mt-2">
            <a href="login.html" class="btn btn-primary btn-lg px-5 py-3 fs-5 shadow-lg float-idle rounded-pill">Ready to Park? Get Started <i class="bi bi-arrow-right ms-2"></i></a>
        </div>
        <div class="mt-5 pt-5 d-flex gap-4 justify-content-center text-muted opacity-75">
            <div><i class="bi bi-shield-check fs-2 d-block mb-2 text-primary"></i> Secure Payments</div>
            <div><i class="bi bi-qr-code-scan fs-2 d-block mb-2 text-primary"></i> Digital Pass</div>
            <div><i class="bi bi-clock-history fs-2 d-block mb-2 text-primary"></i> Real-time Availability</div>
        </div>
    </div>
</body>
</html>
