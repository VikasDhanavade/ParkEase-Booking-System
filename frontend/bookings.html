<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Bookings - ParkEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand parking-brand" href="#">ParkEase</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="bookings.html">My Bookings</a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="admin.html" id="adminViewBtn" class="btn btn-outline-primary btn-sm rounded-pill px-3 d-none"><i class="bi bi-shield-lock me-1"></i>Admin View</a>
                <span class="fw-medium text-dark bg-light px-3 py-1 rounded-pill" id="userName"><i class="bi bi-person-circle me-1 text-muted"></i>User</span>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">My Bookings</h2>
        <div id="alertMsg" class="alert d-none"></div>

        <ul class="nav nav-tabs mb-4" id="bookingTabs">
            <li class="nav-item">
                <button class="nav-link active" id="upcoming-tab" data-bs-toggle="tab"
                    data-bs-target="#upcoming">Upcoming</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="past-tab" data-bs-toggle="tab" data-bs-target="#past">Past</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="upcoming">
                <div class="row row-cols-1 row-cols-md-2 g-4" id="upcomingList"></div>
            </div>
            <div class="tab-pane fade" id="past">
                <div class="row row-cols-1 row-cols-md-2 g-4" id="pastList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }
            const user = getUser();
            document.getElementById('userName').textContent = user.name;

            if (user.role === 'admin') {
                document.getElementById('adminViewBtn').classList.remove('d-none');
            }

            const upcomingList = document.getElementById('upcomingList');
            const pastList = document.getElementById('pastList');
            const alertMsg = document.getElementById('alertMsg');

            function showMsg(msg, isSuccess = true) {
                alertMsg.textContent = msg;
                alertMsg.className = `alert alert-${isSuccess ? 'success' : 'danger'}`;
                alertMsg.classList.remove('d-none');
                setTimeout(() => alertMsg.classList.add('d-none'), 3000);
            }

            async function loadBookings() {
                try {
                    const bookings = await apiFetch('/bookings/me');
                    upcomingList.innerHTML = '';
                    pastList.innerHTML = '';
                    const now = new Date();

                    bookings.forEach(b => {
                        const st = new Date(b.startTime);
                        const et = new Date(b.endTime);
                        const isUpcoming = st > now;

                        let badgeClass = 'bg-success';
                        let statusText = 'Active';

                        // Check if an active booking is drastically over time without checking out yet
                        if (et < now && b.status === 'active') {
                            badgeClass = 'bg-warning';
                            statusText = 'Over Stayed (Active)';
                        }

                        if (b.status === 'cancelled') {
                            badgeClass = 'bg-danger';
                            statusText = 'Cancelled';
                        } else if (b.status === 'completed') {
                            badgeClass = 'bg-secondary';
                            statusText = 'Completed';
                        }

                        const statusBadge = `<span class="badge ${badgeClass}">${statusText}</span>`;

                        const cancelBtn = (isUpcoming && b.status === 'active')
                            ? `<button class="btn btn-sm btn-outline-danger mt-3 me-2" onclick="cancelBooking('${b._id}')">Cancel</button>`
                            : '';

                        const checkoutBtn = (b.status === 'active')
                            ? `<button class="btn btn-sm btn-primary mt-3" onclick="checkoutBooking('${b._id}')">Checkout Now</button>`
                            : '';

                        const viewTicketBtn = `<a href="ticket?id=${b._id}" class="btn btn-sm btn-outline-success mt-3"><i class="bi bi-qr-code"></i> View Ticket</a>`;

                        const penaltyText = b.penaltyAmount > 0
                            ? `<br><small class="text-danger fw-bold">+₹${b.penaltyAmount} Penalty (Double Rate Overstay)</small>`
                            : '';

                        const html = `
                            <div class="col">
                                <div class="card shadow-sm h-100 border-0" style="border-radius: 16px; overflow: hidden;">
                                    <div class="card-body d-flex flex-column p-4">
                                        <div class="d-flex justify-content-between align-items-start mb-3">
                                            <div class="flex-grow-1 pe-3">
                                                <h5 class="card-title text-primary mb-1 fw-bold"><i class="bi bi-geo-alt-fill me-1"></i>${b.lotId.name} <small class="text-muted fs-6 fw-normal">(${b.lotId.location})</small></h5>
                                                <div class="mb-3 mt-2">${statusBadge}</div>
                                                <div class="d-flex flex-wrap gap-2 mb-3">
                                                    <span class="badge bg-light text-dark border p-2"><i class="bi bi-p-square-fill text-muted me-1"></i> Slot ${b.slotId.slotNumber} (Floor ${b.slotId.floor || '-'})</span>
                                                    <span class="badge bg-light text-dark border p-2"><i class="bi bi-car-front-fill text-muted me-1"></i> ${b.vehicleNumber} <span class="text-uppercase text-secondary ms-1">(${b.vehicleType})</span></span>
                                                </div>
                                                <div class="bg-light p-3 rounded-3 mb-3 border">
                                                    <div class="d-flex justify-content-between mb-1"><span class="text-muted small">In:</span> <span class="fw-bold fs-6">${st.toLocaleString()}</span></div>
                                                    <div class="d-flex justify-content-between"><span class="text-muted small">Out:</span> <span class="fw-bold fs-6">${et.toLocaleString()}</span></div>
                                                </div>
                                                <p class="mb-1 fs-5 fw-bold text-success">₹${b.amount} <span class="fs-6 text-muted fw-normal">Paid</span> ${penaltyText}</p>
                                            </div>
                                            ${b.qrCodeData ? `<div class="text-center d-none d-sm-block mt-2"><img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(b.qrCodeData)}" class="border p-1 bg-white rounded shadow-sm" alt="QR Code"><div class="mt-2 text-muted small fw-bold"><i class="bi bi-qr-code-scan"></i> Show QR</div></div>` : ''}
                                        </div>
                                        
                                        <!-- Mobile only QR -->
                                        ${b.qrCodeData ? `<div class="d-block d-sm-none text-center mb-3"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(b.qrCodeData)}" class="border p-2 bg-white rounded shadow-sm" alt="QR Code"></div>` : ''}

                                        <div class="mt-auto border-top pt-3 d-flex gap-2 flex-wrap text-nowrap">
                                            ${viewTicketBtn}
                                            ${checkoutBtn}
                                            ${cancelBtn}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;

                        if (isUpcoming) upcomingList.innerHTML += html;
                        else pastList.innerHTML += html;
                    });
                } catch (err) {
                    showMsg(err.message, false);
                }
            }

            window.cancelBooking = async (id) => {
                if (confirm("Are you sure you want to cancel this booking?")) {
                    try {
                        await apiFetch(`/bookings/${id}`, { method: 'DELETE' });
                        showMsg("Booking cancelled successfully");
                        loadBookings();
                    } catch (err) {
                        showMsg(err.message, false);
                    }
                }
            };

            window.checkoutBooking = async (id) => {
                if (confirm("Confirm vehicle checkout?")) {
                    try {
                        const res = await apiFetch(`/bookings/${id}/checkout`, { method: 'PATCH' });
                        if (res.penaltyAmount > 0) {
                            showMsg(`Checkout complete! However, you overstayed your allocated time and incurred a double-rate penalty of ₹${res.penaltyAmount}.`, false);
                        } else {
                            showMsg("Checkout completed successfully! Thank you.");
                        }
                        loadBookings();
                    } catch (err) {
                        showMsg(err.message, false);
                    }
                }
            };

            loadBookings();
        });
    </script>
</body>

</html>
